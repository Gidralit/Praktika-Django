{% extends 'index.html' %}
{% block content %}
<div class="register-container">
  <form method="post">
    {% csrf_token %}
    {{user_form.as_p}}
    <button type="submit">Зарегистрироваться</button>
          {% if user_form.errors %}
            {% for error in user_form.errors %}
                {{error}}
            {% endfor %}
          {% endif %}
  </form>
</div>
{% endblock %}
